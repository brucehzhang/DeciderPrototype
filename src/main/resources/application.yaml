spring:
  application:
    name: DeciderPrototype
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      endpoint: http://localhost:4566
    stream:
      bindings:
        # <consumerBeanName>-<in/out>-<index>
        samplingAgentEventConsumer-in-0:
          destination: sampling_agent_event_stream
          # Consumer group (each message will only be consumed once per group)
          # Auto-creates DynamoDb for metadata and distributed lock
          group: sampling_agent_consumer_group
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-3.6-flash
    mcp:
      client:
        enabled: true
        name: sampling-decider-client
        version: 1.0.0
        request-timeout: 30s
        type: SYNC
        streamable-http:
          connections:
            tuningprototype:
              url: http://localhost:8080